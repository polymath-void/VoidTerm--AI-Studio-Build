name: VoidTerm Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Production Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          # Install NDK version 25.2.9519653 or fallback to latest
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Library with Cargo NDK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd hybrid-term-broker
          cargo ndk --target aarch64-linux-android --android-platform 26 build --release
          cargo ndk --target aarch64-linux-android --android-platform 26 build --release --bin guest_daemon

      - name: Prepare JNI Libraries Directory
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          # Copy dynamic/static binary into Android project structure
          cp hybrid-term-broker/target/aarch64-linux-android/release/libhybrid_term_broker.so android/app/src/main/jniLibs/arm64-v8a/ || cp hybrid-term-broker/target/aarch64-linux-android/release/libhybrid_term_broker.a android/app/src/main/jniLibs/arm64-v8a/ || true
          # Keep track of guest daemon inside assets for dynamic microVM booting
          mkdir -p android/app/src/main/assets
          cp hybrid-term-broker/target/aarch64-linux-android/release/guest_daemon android/app/src/main/assets/ || true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > android/app/debug.keystore
            echo "KEYSTORE_DECODED=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_DECODED=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: |
          chmod +x gradlew || true
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        if: env.KEYSTORE_DECODED == 'true'
        run: |
          # Locate built unsigned/release APKs
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Signing APK: $APK_PATH"
            # Get apksigner path from Android SDK build-tools
            APKSIGNER_PATH=$(find ${ANDROID_SDK_ROOT}/build-tools -name "apksigner" | sort -V | tail -n 1)
            $APKSIGNER_PATH sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/release/voidterm-signed-release.apk $APK_PATH
          else
            echo "No release APK found to sign."
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidterm-production-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
