name: VoidTerm CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-rust:
    name: Rust IPC Broker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cargo Check (aarch64-linux-android)
        run: |
          cd hybrid-term-broker
          cargo check --target aarch64-linux-android

      - name: Cargo Check & Test (Host)
        run: |
          cd hybrid-term-broker
          cargo check
          cargo test --lib

      - name: Build Host Binaries
        run: |
          cd hybrid-term-broker
          cargo build

      - name: Upload Rust Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidterm-rust-binaries
          path: |
            **/target/**/hybrid-term-broker
            **/target/**/guest_daemon
            **/target/**/libhybrid_term_broker.*
          if-no-files-found: warn

  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidterm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
